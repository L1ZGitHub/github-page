server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Caching is set with "expires" in the locations below, never with add_header,
    # so these headers are inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The page's own script and styles are inline; the film is fetched whole and played from a blob.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # Pages are always revalidated; the heavy files are kept.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    # The legal notice answers without its extension; the French name leads to it.
    location = /legal {
        try_files /legal.html =404;
        expires -1;
    }
    location ~ ^/mentions-legales/?$ { return 301 /legal; }
    location ^~ /film/  { expires 7d; }
    location ^~ /fonts/ { expires 30d; }
    location ^~ /files/ { expires 1d; }
    location ~* \.(?:ico|png|jpg|svg|webp|js)$ { expires 1d; }
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1d;
    }

    # The previous site (Next.js, with a blog): its two pages now live on the front page,
    # and the blog, its feed and its admin are gone for good.
    location ~ ^/(?:about|contact)/?$ { return 301 /; }
    location ~ ^/(?:blog|admin|editorial-policy|feed\.xml)(?:/|$) { return 410; }

    error_page 404 410 /404.html;
    location = /404.html { internal; }
}
